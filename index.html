<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TQE — Order Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f5f0eb;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem;
    }

    /* Password gate */
    .gate {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    .gate-card {
      background: #fff;
      max-width: 400px;
      width: 100%;
      padding: 2.5rem;
      border: 1px solid rgba(0,0,0,0.08);
      text-align: center;
    }
    .gate-card h1 {
      font-family: Georgia, serif;
      font-size: 1.4rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }
    .gate-card p {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 1.5rem;
    }
    .gate-input {
      padding: 0.75rem;
      font-size: 1rem;
      border: 1px solid rgba(0,0,0,0.12);
      background: transparent;
      outline: none;
      width: 200px;
      text-align: center;
      font-family: inherit;
    }
    .gate-input:focus { border-color: rgba(0,0,0,0.35); }
    .gate-btn {
      display: block;
      margin: 1rem auto 0;
      padding: 0.75rem 2rem;
      background: #1a1a1a;
      color: #f5f0eb;
      border: none;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      cursor: pointer;
    }
    .gate-btn:hover { opacity: 0.85; }
    .gate-error {
      color: #c62828;
      font-size: 0.85rem;
      margin-top: 0.75rem;
      display: none;
    }

    /* Dashboard */
    .dashboard { display: none; }
    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .dashboard-header h1 {
      font-family: Georgia, serif;
      font-size: 1.6rem;
      font-weight: 400;
    }
    .refresh-btn {
      padding: 0.6rem 1.2rem;
      background: #1a1a1a;
      color: #f5f0eb;
      border: none;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
    }
    .refresh-btn:hover { opacity: 0.85; }
    .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Status bar */
    .status-bar {
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      display: none;
    }
    .status-bar.info { display: block; background: #f0ece5; color: #666; }
    .status-bar.success { display: block; background: #e8f5e9; color: #2e7d32; }
    .status-bar.error { display: block; background: #fbe9e7; color: #c62828; }

    /* Table */
    .orders-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid #e0dbd2;
    }
    .orders-table th {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #999;
      padding: 12px 16px;
      text-align: left;
      background: #f5f2ed;
      border-bottom: 1px solid #e0dbd2;
      white-space: nowrap;
    }
    .orders-table td {
      padding: 14px 16px;
      font-size: 0.9rem;
      border-bottom: 1px solid #f0ece5;
      vertical-align: top;
    }
    .orders-table tr:last-child td { border-bottom: none; }
    .orders-table tr:hover td { background: #faf9f6; }

    .order-number {
      font-weight: 600;
      white-space: nowrap;
    }
    .order-date {
      color: #999;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .order-customer { font-weight: 500; }
    .order-email { color: #999; font-size: 0.8rem; }
    .order-items { font-size: 0.85rem; color: #666; }
    .order-total { font-weight: 600; white-space: nowrap; }

    /* Checkbox */
    .supplier-check {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #1a1a1a;
    }

    /* Action button */
    .inspect-btn {
      padding: 0.45rem 0.8rem;
      background: #1a1a1a;
      color: #f5f0eb;
      border: none;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      white-space: nowrap;
    }
    .inspect-btn:hover { opacity: 0.85; }
    .inspect-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .inspect-btn.sent {
      background: #e8f5e9;
      color: #2e7d32;
      cursor: default;
    }

    /* Sent status + re-send control */
    .action-wrap { display: flex; align-items: center; gap: 0.5rem; }
    .sent-label {
      display: inline-block;
      padding: 0.45rem 0.8rem;
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .resend-btn {
      padding: 0.4rem 0.6rem;
      background: transparent;
      color: #8a8579;
      border: 1px solid #e0dbd2;
      font-family: inherit;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      white-space: nowrap;
    }
    .resend-btn:hover { color: #1a1a1a; border-color: #8a8579; }
    .resend-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Failed state (send did not go through) */
    .failed-label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.8rem;
      background: #fbe9e7;
      color: #c62828;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .failed-label::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #c62828;
    }
    .retry-btn {
      padding: 0.4rem 0.7rem;
      background: #c62828;
      color: #fff;
      border: none;
      font-family: inherit;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      white-space: nowrap;
    }
    .retry-btn:hover { opacity: 0.88; }
    .retry-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .orders-table tr.is-failed td { background: #fdf4f2; }
    .orders-table tr.is-failed:hover td { background: #fbeeeb; }

    /* View tabs (Orders / To Order) */
    .viewtabs { display: inline-flex; border: 1px solid #e0dbd2; background: #fff; margin-bottom: 1.5rem; }
    .viewtabs button {
      padding: 0.6rem 1.4rem; background: transparent; border: none; border-right: 1px solid #e0dbd2;
      font-family: inherit; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
      color: #999; cursor: pointer;
    }
    .viewtabs button:last-child { border-right: none; }
    .viewtabs button.active { background: #1a1a1a; color: #f5f0eb; }
    .panel { display: none; }
    .panel.active { display: block; }

    /* To Order sub-toggle + actions */
    .subbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; }
    .subtabs { display: inline-flex; border: 1px solid #e0dbd2; background: #fff; }
    .subtabs button {
      padding: 0.5rem 1.1rem; background: transparent; border: none; border-right: 1px solid #e0dbd2;
      font-family: inherit; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
      color: #999; cursor: pointer;
    }
    .subtabs button:last-child { border-right: none; }
    .subtabs button.active { background: #e8e2d9; color: #1a1a1a; }
    .copy-btn {
      padding: 0.5rem 1rem; background: transparent; color: #8a8579; border: 1px solid #e0dbd2;
      font-family: inherit; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer;
    }
    .copy-btn:hover { color: #1a1a1a; border-color: #8a8579; }
    .caption { font-size: 0.8rem; color: #999; margin-bottom: 1rem; }

    /* Buy-list table */
    table.buy { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e0dbd2; }
    .buy th {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #999;
      padding: 12px 16px; text-align: left; background: #f5f2ed; border-bottom: 1px solid #e0dbd2; white-space: nowrap;
    }
    .buy td { padding: 13px 16px; font-size: 0.9rem; border-bottom: 1px solid #f0ece5; vertical-align: middle; }
    .buy tr:last-child td { border-bottom: none; }
    .buy tr:hover td { background: #faf9f6; }
    .buy .prod { font-weight: 500; }
    .buy .variant { color: #6f6a62; }
    .buy .qty { font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
    .buy .since { color: #999; font-size: 0.82rem; white-space: nowrap; }
    .buy th.qty-h { text-align: center; }

    /* By-date groups */
    .daygroup { background: #fff; border: 1px solid #e0dbd2; margin-bottom: 1rem; }
    .dayhead { display: flex; align-items: baseline; justify-content: space-between; padding: 11px 16px; background: #f5f2ed; border-bottom: 1px solid #e0dbd2; }
    .dayhead .d { font-weight: 600; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .dayhead .c { font-size: 0.75rem; color: #999; }
    .dayrow { display: flex; align-items: center; gap: 0.75rem; padding: 11px 16px; border-bottom: 1px solid #f0ece5; font-size: 0.9rem; }
    .dayrow:last-child { border-bottom: none; }
    .dayrow .q { min-width: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .dayrow .v { color: #6f6a62; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #999;
      font-size: 0.95rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body { padding: 1rem; }
      .orders-table { font-size: 0.8rem; display: block; overflow-x: auto; }
      .orders-table th, .orders-table td { padding: 10px 12px; }
    }
  </style>
</head>
<body>

  <!-- Password Gate -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <h1>TQE Admin</h1>
      <p>Enter password to access the order dashboard.</p>
      <input type="password" class="gate-input" id="gate-pw" placeholder="Password" />
      <button class="gate-btn" id="gate-btn">Enter</button>
      <div class="gate-error" id="gate-error">Incorrect password.</div>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="dashboard-header">
      <h1>Order Dashboard</h1>
      <button class="refresh-btn" id="refresh-btn">Refresh Orders</button>
    </div>

    <div class="status-bar" id="status-bar"></div>

    <div class="viewtabs" id="viewtabs">
      <button data-view="orders" class="active">Orders</button>
      <button data-view="toorder">To Order</button>
    </div>

    <!-- Orders panel -->
    <div class="panel active" id="panel-orders">
      <table class="orders-table" id="orders-table">
        <thead>
          <tr>
            <th>Order</th>
            <th>Date</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total</th>
            <th>Ordered</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="orders-body"></tbody>
      </table>
      <div class="empty-state" id="empty-state" style="display:none;">No unfulfilled orders.</div>
    </div>

    <!-- To Order panel (supplier-safe: no order #, customer, or price) -->
    <div class="panel" id="panel-toorder">
      <div class="subbar">
        <div class="subtabs">
          <button data-sub="buy" class="active">Buy-list</button>
          <button data-sub="date">By date</button>
        </div>
        <button class="copy-btn" id="copyBtn">Copy as text</button>
      </div>
      <p class="caption" id="toorder-caption"></p>
      <div id="sub-buy">
        <table class="buy">
          <thead>
            <tr><th>Product</th><th>Variant</th><th class="qty-h">Qty</th><th>Since</th></tr>
          </thead>
          <tbody id="buyBody"></tbody>
        </table>
      </div>
      <div id="sub-date" style="display:none;"></div>
      <div class="empty-state" id="toorder-empty" style="display:none;">Nothing to order — all caught up.</div>
    </div>
  </div>

  <script>
    // IMPORTANT: Replace this with your Cloudflare Worker URL after deploying
    var WORKER_URL = 'https://tqf-api.projects-kfb.workers.dev';
    var ALL_ORDERS = [];
    var _toBuy = [], _toByDate = [];

    // The dashboard password doubles as the API credential. It is typed at
    // runtime and kept only in sessionStorage — never hardcoded in this file,
    // which is public on GitHub Pages. Every Worker call carries it in the
    // X-Dashboard-Auth header; the Worker rejects anything that doesn't match.
    var DASH_PW = sessionStorage.getItem('tqf_pw') || '';
    function authHeaders(extra) {
      var h = extra || {};
      h['X-Dashboard-Auth'] = DASH_PW;
      return h;
    }
    // Wrong or expired password: drop the session and return to the gate.
    function lockOut() {
      DASH_PW = '';
      sessionStorage.removeItem('tqf_pw');
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('gate').style.display = 'block';
      document.getElementById('gate-error').style.display = 'block';
      var rb = document.getElementById('refresh-btn');
      if (rb) { rb.disabled = false; rb.textContent = 'Refresh Orders'; }
    }

    // Password gate. No client-side password check any more — we store whatever
    // is typed and let the Worker be the judge (a bad password 401s in
    // loadOrders, which calls lockOut and re-shows the gate with the error).
    document.getElementById('gate-btn').addEventListener('click', function() {
      var pw = document.getElementById('gate-pw').value;
      if (!pw) { document.getElementById('gate-error').style.display = 'block'; return; }
      DASH_PW = pw;
      sessionStorage.setItem('tqf_pw', pw);
      document.getElementById('gate-error').style.display = 'none';
      document.getElementById('gate').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadOrders();
    });
    document.getElementById('gate-pw').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('gate-btn').click();
    });
    // Stay signed in across refreshes within the same browser session.
    if (DASH_PW) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadOrders();
    }

    // Status helper
    function showStatus(msg, type) {
      var bar = document.getElementById('status-bar');
      bar.textContent = msg;
      bar.className = 'status-bar ' + type;
    }

    // Load orders
    function loadOrders() {
      var btn = document.getElementById('refresh-btn');
      btn.disabled = true;
      btn.textContent = 'Loading...';
      showStatus('Fetching orders from Shopify...', 'info');

      fetch(WORKER_URL + '/api/orders', { headers: authHeaders() })
        .then(function(r) {
          if (r.status === 401) { lockOut(); return null; }
          return r.json();
        })
        .then(function(data) {
          if (!data) return;
          if (data.error) {
            showStatus('Error: ' + data.error, 'error');
            btn.disabled = false;
            btn.textContent = 'Refresh Orders';
            return;
          }
          ALL_ORDERS = data.orders || [];
          renderOrders(ALL_ORDERS);
          renderToOrder();
          showStatus(data.orders.length + ' unfulfilled order(s) loaded.', 'success');
          btn.disabled = false;
          btn.textContent = 'Refresh Orders';
        })
        .catch(function(err) {
          showStatus('Failed to fetch orders: ' + err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Refresh Orders';
        });
    }

    // Get supplier checkbox state from localStorage (optimistic, per-device fallback).
    function getSupplierState() {
      try { return JSON.parse(localStorage.getItem('tqf_supplier') || '{}'); }
      catch(e) { return {}; }
    }
    function saveSupplierState(state) {
      localStorage.setItem('tqf_supplier', JSON.stringify(state));
    }

    // Add/remove a tag in a comma string, case-insensitively (mirrors the Worker).
    function applyTag(tags, tag, add) {
      var low = tag.toLowerCase();
      var list = (tags || '').split(',').map(function(t) { return t.trim(); }).filter(Boolean)
        .filter(function(t) { return t.toLowerCase() !== low; });
      if (add) list.push(tag);
      return list.join(', ');
    }

    // Shared "ordered from supplier" state via the 'sourced' Shopify tag, so both
    // operators agree on any device. localStorage stays as an optimistic fallback.
    function isOrdered(order) {
      var tags = (order.tags || '').split(',').map(function(t) { return t.trim().toLowerCase(); });
      return tags.indexOf('sourced') !== -1 || !!getSupplierState()[order.name];
    }

    // Toggle the shared 'sourced' tag via the Worker. On failure, revert the box.
    function fireOrdered(order, cb) {
      var value = cb.checked;
      cb.disabled = true;
      return fetch(WORKER_URL + '/api/ordered', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ order_id: order.id, tags: order.tags || '', value: value })
      })
      .then(function(r) {
        if (r.status === 401) { lockOut(); return { success: false, error: 'Session expired — sign in again' }; }
        return r.json();
      })
      .then(function(data) {
        cb.disabled = false;
        if (data.success) {
          order.tags = applyTag(order.tags, 'sourced', value);
          var st = getSupplierState(); st[order.name] = value; saveSupplierState(st);
          showStatus((value ? 'Marked ordered: ' : 'Unmarked ordered: ') + order.name, 'success');
          renderToOrder();
          return true;
        }
        cb.checked = !value;
        showStatus('Could not update Ordered for ' + order.name + ': ' + (data.error || 'Unknown error'), 'error');
        return false;
      })
      .catch(function(err) {
        cb.disabled = false;
        cb.checked = !value;
        showStatus('Could not update Ordered for ' + order.name + ': ' + err.message, 'error');
        return false;
      });
    }

    // Get sent state from localStorage (optimistic, per-device fallback).
    function getSentState() {
      try { return JSON.parse(localStorage.getItem('tqf_sent') || '{}'); }
      catch(e) { return {}; }
    }
    function saveSentState(state) {
      localStorage.setItem('tqf_sent', JSON.stringify(state));
    }

    // Authoritative, shared sent-state: the order carries an 'inspected' tag in
    // Shopify once a real send succeeds, so every device sees the same thing.
    // localStorage is only an optimistic fallback for the device that just sent.
    function isInspected(order) {
      var tags = (order.tags || '').split(',').map(function(t) { return t.trim().toLowerCase(); });
      return tags.indexOf('inspected') !== -1 || !!getSentState()[order.name];
    }

    // Fire the inspection event via the Worker. Resolves true on confirmed
    // success, false otherwise. Only a real success flips the Sent state.
    function fireInspection(order, btn, busyLabel) {
      btn.disabled = true;
      var prev = btn.textContent;
      btn.textContent = busyLabel;
      return fetch(WORKER_URL + '/api/inspect', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({
          email: order.email,
          order_number: order.name,
          order_id: order.id,
          tags: order.tags || ''
        })
      })
      .then(function(r) {
        if (r.status === 401) { lockOut(); return { success: false, error: 'Session expired — sign in again' }; }
        return r.json();
      })
      .then(function(data) {
        if (data.success) {
          var state = getSentState();
          state[order.name] = true;
          saveSentState(state);
          // Keep the in-memory order in sync so a re-render still reads as sent.
          if ((order.tags || '').toLowerCase().indexOf('inspected') === -1) {
            order.tags = (order.tags ? order.tags + ', ' : '') + 'inspected';
          }
          var msg = 'Inspection email sent for ' + order.name + ' to ' + order.email;
          if (data.tagged === false) msg += ' (note: could not tag the order — shared status may not sync)';
          showStatus(msg, 'success');
          return true;
        }
        showStatus('Failed for ' + order.name + ': ' + (data.error || 'Unknown error'), 'error');
        btn.disabled = false;
        btn.textContent = prev;
        return false;
      })
      .catch(function(err) {
        showStatus('Failed for ' + order.name + ': ' + err.message, 'error');
        btn.disabled = false;
        btn.textContent = prev;
        return false;
      });
    }

    // Build the action cell: "Send Inspection" when unsent, or a green "Sent"
    // status with a small "Re-send" button once sent (so a stuck/failed row is
    // always recoverable without touching the API directly).
    function buildActionControl(order) {
      var wrap = document.createElement('div');
      wrap.className = 'action-wrap';

      function rowClass(name, on) {
        var tr = wrap.closest ? wrap.closest('tr') : null;
        if (tr) tr.classList[on ? 'add' : 'remove'](name);
      }

      function renderUnsent() {
        wrap.textContent = '';
        rowClass('is-failed', false);
        var btn = document.createElement('button');
        btn.className = 'inspect-btn';
        btn.textContent = 'Send Inspection';
        btn.addEventListener('click', function() {
          fireInspection(order, btn, 'Sending...').then(function(ok) {
            if (ok) renderSent(); else renderFailed();
          });
        });
        wrap.appendChild(btn);
      }

      function renderSent() {
        wrap.textContent = '';
        rowClass('is-failed', false);
        var label = document.createElement('span');
        label.className = 'sent-label';
        label.textContent = 'Sent';
        var resend = document.createElement('button');
        resend.className = 'resend-btn';
        resend.textContent = 'Re-send';
        resend.addEventListener('click', function() {
          if (!confirm('Re-send the inspection email for ' + order.name + ' to ' + order.email + '?')) return;
          fireInspection(order, resend, 'Re-sending...').then(function() {
            renderSent();
          });
        });
        wrap.appendChild(label);
        wrap.appendChild(resend);
      }

      function renderFailed() {
        wrap.textContent = '';
        rowClass('is-failed', true);
        var label = document.createElement('span');
        label.className = 'failed-label';
        label.textContent = 'Failed';
        var retry = document.createElement('button');
        retry.className = 'retry-btn';
        retry.textContent = 'Retry';
        retry.addEventListener('click', function() {
          fireInspection(order, retry, 'Retrying...').then(function(ok) {
            if (ok) renderSent(); else renderFailed();
          });
        });
        wrap.appendChild(label);
        wrap.appendChild(retry);
      }

      if (isInspected(order)) renderSent(); else renderUnsent();
      return wrap;
    }

    // Render orders
    function renderOrders(orders) {
      var tbody = document.getElementById('orders-body');
      var empty = document.getElementById('empty-state');
      var table = document.getElementById('orders-table');
      tbody.textContent = '';

      if (orders.length === 0) {
        table.style.display = 'none';
        empty.style.display = 'block';
        return;
      }

      table.style.display = 'table';
      empty.style.display = 'none';

      var supplierState = getSupplierState();
      var sentState = getSentState();

      orders.forEach(function(order) {
        var tr = document.createElement('tr');

        // Order #
        var tdOrder = document.createElement('td');
        var numDiv = document.createElement('div');
        numDiv.className = 'order-number';
        numDiv.textContent = order.name;
        tdOrder.appendChild(numDiv);
        tr.appendChild(tdOrder);

        // Date
        var tdDate = document.createElement('td');
        tdDate.className = 'order-date';
        var d = new Date(order.created_at);
        tdDate.textContent = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        tr.appendChild(tdDate);

        // Customer
        var tdCust = document.createElement('td');
        var nameDiv = document.createElement('div');
        nameDiv.className = 'order-customer';
        nameDiv.textContent = order.customer_name;
        var emailDiv = document.createElement('div');
        emailDiv.className = 'order-email';
        emailDiv.textContent = order.email;
        tdCust.appendChild(nameDiv);
        tdCust.appendChild(emailDiv);
        tr.appendChild(tdCust);

        // Items
        var tdItems = document.createElement('td');
        tdItems.className = 'order-items';
        var itemTexts = order.items.map(function(i) {
          return i.title + (i.variant ? ' (' + i.variant + ')' : '') + ' x' + i.quantity;
        });
        tdItems.textContent = itemTexts.join(', ');
        tr.appendChild(tdItems);

        // Total
        var tdTotal = document.createElement('td');
        tdTotal.className = 'order-total';
        tdTotal.textContent = '$' + parseFloat(order.total).toFixed(2);
        tr.appendChild(tdTotal);

        // Supplier checkbox
        var tdSupplier = document.createElement('td');
        tdSupplier.style.textAlign = 'center';
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'supplier-check';
        cb.checked = isOrdered(order);
        cb.addEventListener('change', function() {
          fireOrdered(order, cb);
        });
        tdSupplier.appendChild(cb);
        tr.appendChild(tdSupplier);

        // Action button (Send Inspection, or Sent + Re-send)
        var tdAction = document.createElement('td');
        tdAction.appendChild(buildActionControl(order));
        tr.appendChild(tdAction);

        tbody.appendChild(tr);
      });
    }

    // ---- To Order (supplier buy-list) ----
    function fmtDay(iso) {
      return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    function dayKey(iso) {
      var d = new Date(iso);
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    }

    // Consolidate line items across orders into one row per product+variant.
    function buildBuyList(orders) {
      var map = {};
      orders.forEach(function(o) {
        (o.items || []).forEach(function(it) {
          var key = it.title + '|' + (it.variant || '');
          if (!map[key]) map[key] = { title: it.title, variant: it.variant || '', qty: 0, since: o.created_at };
          map[key].qty += it.quantity;
          if (new Date(o.created_at) < new Date(map[key].since)) map[key].since = o.created_at;
        });
      });
      return Object.keys(map).map(function(k) { return map[k]; }).sort(function(a, b) {
        var diff = new Date(a.since) - new Date(b.since);
        return diff !== 0 ? diff : a.title.localeCompare(b.title);
      });
    }

    // Group orders by day (oldest first); consolidate items within each day.
    function buildByDate(orders) {
      var groups = {};
      orders.forEach(function(o) {
        var k = dayKey(o.created_at);
        if (!groups[k]) groups[k] = { date: o.created_at, items: {} };
        (o.items || []).forEach(function(it) {
          var ik = it.title + '|' + (it.variant || '');
          if (!groups[k].items[ik]) groups[k].items[ik] = { title: it.title, variant: it.variant || '', qty: 0 };
          groups[k].items[ik].qty += it.quantity;
        });
      });
      return Object.keys(groups).sort().map(function(k) {
        var g = groups[k];
        var items = Object.keys(g.items).map(function(x) { return g.items[x]; })
          .sort(function(a, b) { return a.title.localeCompare(b.title); });
        var units = items.reduce(function(s, i) { return s + i.qty; }, 0);
        return { date: g.date, items: items, units: units };
      });
    }

    function activeSub() {
      var b = document.querySelector('.subtabs button.active');
      return b ? b.dataset.sub : 'buy';
    }

    function renderToOrder() {
      // Only items not yet ordered from the supplier.
      var pending = ALL_ORDERS.filter(function(o) { return !isOrdered(o); });
      _toBuy = buildBuyList(pending);
      _toByDate = buildByDate(pending);
      var sub = activeSub();
      var empty = _toBuy.length === 0;

      // Buy-list rows
      var buyBody = document.getElementById('buyBody');
      buyBody.textContent = '';
      _toBuy.forEach(function(r) {
        var tr = document.createElement('tr');
        var t1 = document.createElement('td'); t1.className = 'prod'; t1.textContent = r.title;
        var t2 = document.createElement('td'); t2.className = 'variant'; t2.textContent = r.variant || '—';
        var t3 = document.createElement('td'); t3.className = 'qty'; t3.textContent = r.qty;
        var t4 = document.createElement('td'); t4.className = 'since'; t4.textContent = fmtDay(r.since);
        tr.appendChild(t1); tr.appendChild(t2); tr.appendChild(t3); tr.appendChild(t4);
        buyBody.appendChild(tr);
      });

      // By-date groups
      var subDate = document.getElementById('sub-date');
      subDate.textContent = '';
      _toByDate.forEach(function(g) {
        var box = document.createElement('div'); box.className = 'daygroup';
        var head = document.createElement('div'); head.className = 'dayhead';
        var d = document.createElement('span'); d.className = 'd'; d.textContent = fmtDay(g.date);
        var c = document.createElement('span'); c.className = 'c';
        c.textContent = g.units + ' piece' + (g.units === 1 ? '' : 's') + ' to order';
        head.appendChild(d); head.appendChild(c); box.appendChild(head);
        g.items.forEach(function(it) {
          var row = document.createElement('div'); row.className = 'dayrow';
          var q = document.createElement('span'); q.className = 'q'; q.textContent = 'x' + it.qty;
          var name = document.createElement('span'); name.textContent = it.title;
          var v = document.createElement('span'); v.className = 'v'; v.textContent = it.variant ? '(' + it.variant + ')' : '';
          row.appendChild(q); row.appendChild(name); row.appendChild(v); box.appendChild(row);
        });
        subDate.appendChild(box);
      });

      // Caption + visibility
      var pieces = _toBuy.reduce(function(s, r) { return s + r.qty; }, 0);
      var cap = document.getElementById('toorder-caption');
      cap.textContent = sub === 'buy'
        ? pieces + ' piece' + (pieces === 1 ? '' : 's') + ' across ' + _toBuy.length + ' product' + (_toBuy.length === 1 ? '' : 's') + ' to order. Items you tick Ordered drop off automatically.'
        : 'Grouped by order date, oldest first. Duplicate products merged within a day.';

      document.getElementById('toorder-empty').style.display = empty ? 'block' : 'none';
      document.querySelector('#panel-toorder .subbar').style.display = empty ? 'none' : 'flex';
      cap.style.display = empty ? 'none' : 'block';
      document.getElementById('sub-buy').style.display = (!empty && sub === 'buy') ? 'block' : 'none';
      document.getElementById('sub-date').style.display = (!empty && sub === 'date') ? 'block' : 'none';
    }

    // View toggle (Orders / To Order)
    document.querySelectorAll('.viewtabs button').forEach(function(b) {
      b.addEventListener('click', function() {
        document.querySelectorAll('.viewtabs button').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        document.getElementById('panel-orders').classList.toggle('active', b.dataset.view === 'orders');
        document.getElementById('panel-toorder').classList.toggle('active', b.dataset.view === 'toorder');
        if (b.dataset.view === 'toorder') renderToOrder();
      });
    });

    // Sub-toggle (Buy-list / By date)
    document.querySelectorAll('.subtabs button').forEach(function(b) {
      b.addEventListener('click', function() {
        document.querySelectorAll('.subtabs button').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        renderToOrder();
      });
    });

    // Copy the current view as plain text for relaying to the supplier.
    document.getElementById('copyBtn').addEventListener('click', function() {
      var text;
      if (activeSub() === 'buy') {
        text = 'TO ORDER\n' + _toBuy.map(function(r) {
          return '- ' + r.qty + 'x ' + r.title + (r.variant ? ' (' + r.variant + ')' : '');
        }).join('\n');
      } else {
        text = _toByDate.map(function(g) {
          return fmtDay(g.date) + '\n' + g.items.map(function(it) {
            return '  - ' + it.qty + 'x ' + it.title + (it.variant ? ' (' + it.variant + ')' : '');
          }).join('\n');
        }).join('\n\n');
      }
      navigator.clipboard.writeText(text).then(function() {
        var btn = document.getElementById('copyBtn');
        var prev = btn.textContent; btn.textContent = 'Copied ✓';
        setTimeout(function() { btn.textContent = prev; }, 1400);
      });
    });

    // Refresh button
    document.getElementById('refresh-btn').addEventListener('click', loadOrders);
  </script>

</body>
