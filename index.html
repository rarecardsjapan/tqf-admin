<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TQE — Order Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f5f0eb;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem;
    }

    /* Password gate */
    .gate {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    .gate-card {
      background: #fff;
      max-width: 400px;
      width: 100%;
      padding: 2.5rem;
      border: 1px solid rgba(0,0,0,0.08);
      text-align: center;
    }
    .gate-card h1 {
      font-family: Georgia, serif;
      font-size: 1.4rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }
    .gate-card p {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 1.5rem;
    }
    .gate-input {
      padding: 0.75rem;
      font-size: 1rem;
      border: 1px solid rgba(0,0,0,0.12);
      background: transparent;
      outline: none;
      width: 200px;
      text-align: center;
      font-family: inherit;
    }
    .gate-input:focus { border-color: rgba(0,0,0,0.35); }
    .gate-btn {
      display: block;
      margin: 1rem auto 0;
      padding: 0.75rem 2rem;
      background: #1a1a1a;
      color: #f5f0eb;
      border: none;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      cursor: pointer;
    }
    .gate-btn:hover { opacity: 0.85; }
    .gate-error {
      color: #c62828;
      font-size: 0.85rem;
      margin-top: 0.75rem;
      display: none;
    }

    /* Dashboard */
    .dashboard { display: none; }
    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .dashboard-header h1 {
      font-family: Georgia, serif;
      font-size: 1.6rem;
      font-weight: 400;
    }
    .refresh-btn {
      padding: 0.6rem 1.2rem;
      background: #1a1a1a;
      color: #f5f0eb;
      border: none;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
    }
    .refresh-btn:hover { opacity: 0.85; }
    .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Status bar */
    .status-bar {
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      display: none;
    }
    .status-bar.info { display: block; background: #f0ece5; color: #666; }
    .status-bar.success { display: block; background: #e8f5e9; color: #2e7d32; }
    .status-bar.error { display: block; background: #fbe9e7; color: #c62828; }

    /* Table */
    .orders-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid #e0dbd2;
    }
    .orders-table th {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #999;
      padding: 12px 16px;
      text-align: left;
      background: #f5f2ed;
      border-bottom: 1px solid #e0dbd2;
      white-space: nowrap;
    }
    .orders-table td {
      padding: 14px 16px;
      font-size: 0.9rem;
      border-bottom: 1px solid #f0ece5;
      vertical-align: top;
    }
    .orders-table tr:last-child td { border-bottom: none; }
    .orders-table tr:hover td { background: #faf9f6; }

    .order-number {
      font-weight: 600;
      white-space: nowrap;
    }
    .order-date {
      color: #999;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .order-customer { font-weight: 500; }
    .order-email { color: #999; font-size: 0.8rem; }
    .order-items { font-size: 0.85rem; color: #666; }
    .order-total { font-weight: 600; white-space: nowrap; }

    /* Checkbox */
    .supplier-check {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #1a1a1a;
    }

    /* Action button */
    .inspect-btn {
      padding: 0.45rem 0.8rem;
      background: #1a1a1a;
      color: #f5f0eb;
      border: none;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      white-space: nowrap;
    }
    .inspect-btn:hover { opacity: 0.85; }
    .inspect-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .inspect-btn.sent {
      background: #e8f5e9;
      color: #2e7d32;
      cursor: default;
    }

    /* Sent status + re-send control */
    .action-wrap { display: flex; align-items: center; gap: 0.5rem; }
    .sent-label {
      display: inline-block;
      padding: 0.45rem 0.8rem;
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .resend-btn {
      padding: 0.4rem 0.6rem;
      background: transparent;
      color: #8a8579;
      border: 1px solid #e0dbd2;
      font-family: inherit;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      white-space: nowrap;
    }
    .resend-btn:hover { color: #1a1a1a; border-color: #8a8579; }
    .resend-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Failed state (send did not go through) */
    .failed-label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.8rem;
      background: #fbe9e7;
      color: #c62828;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .failed-label::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #c62828;
    }
    .retry-btn {
      padding: 0.4rem 0.7rem;
      background: #c62828;
      color: #fff;
      border: none;
      font-family: inherit;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      white-space: nowrap;
    }
    .retry-btn:hover { opacity: 0.88; }
    .retry-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .orders-table tr.is-failed td { background: #fdf4f2; }
    .orders-table tr.is-failed:hover td { background: #fbeeeb; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #999;
      font-size: 0.95rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body { padding: 1rem; }
      .orders-table { font-size: 0.8rem; display: block; overflow-x: auto; }
      .orders-table th, .orders-table td { padding: 10px 12px; }
    }
  </style>
</head>
<body>

  <!-- Password Gate -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <h1>TQE Admin</h1>
      <p>Enter password to access the order dashboard.</p>
      <input type="password" class="gate-input" id="gate-pw" placeholder="Password" />
      <button class="gate-btn" id="gate-btn">Enter</button>
      <div class="gate-error" id="gate-error">Incorrect password.</div>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="dashboard-header">
      <h1>Order Dashboard</h1>
      <button class="refresh-btn" id="refresh-btn">Refresh Orders</button>
    </div>

    <div class="status-bar" id="status-bar"></div>

    <table class="orders-table" id="orders-table">
      <thead>
        <tr>
          <th>Order</th>
          <th>Date</th>
          <th>Customer</th>
          <th>Items</th>
          <th>Total</th>
          <th>Ordered</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="orders-body"></tbody>
    </table>

    <div class="empty-state" id="empty-state" style="display:none;">No unfulfilled orders.</div>
  </div>

  <script>
    // IMPORTANT: Replace this with your Cloudflare Worker URL after deploying
    var WORKER_URL = 'https://tqf-api.projects-kfb.workers.dev';
    var PASSWORD = 'inspect';

    // Password gate
    document.getElementById('gate-btn').addEventListener('click', function() {
      if (document.getElementById('gate-pw').value === PASSWORD) {
        document.getElementById('gate').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadOrders();
      } else {
        document.getElementById('gate-error').style.display = 'block';
      }
    });
    document.getElementById('gate-pw').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('gate-btn').click();
    });

    // Status helper
    function showStatus(msg, type) {
      var bar = document.getElementById('status-bar');
      bar.textContent = msg;
      bar.className = 'status-bar ' + type;
    }

    // Load orders
    function loadOrders() {
      var btn = document.getElementById('refresh-btn');
      btn.disabled = true;
      btn.textContent = 'Loading...';
      showStatus('Fetching orders from Shopify...', 'info');

      fetch(WORKER_URL + '/api/orders')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.error) {
            showStatus('Error: ' + data.error, 'error');
            btn.disabled = false;
            btn.textContent = 'Refresh Orders';
            return;
          }
          renderOrders(data.orders);
          showStatus(data.orders.length + ' unfulfilled order(s) loaded.', 'success');
          btn.disabled = false;
          btn.textContent = 'Refresh Orders';
        })
        .catch(function(err) {
          showStatus('Failed to fetch orders: ' + err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Refresh Orders';
        });
    }

    // Get supplier checkbox state from localStorage
    function getSupplierState() {
      try { return JSON.parse(localStorage.getItem('tqf_supplier') || '{}'); }
      catch(e) { return {}; }
    }
    function saveSupplierState(state) {
      localStorage.setItem('tqf_supplier', JSON.stringify(state));
    }

    // Get sent state from localStorage (optimistic, per-device fallback).
    function getSentState() {
      try { return JSON.parse(localStorage.getItem('tqf_sent') || '{}'); }
      catch(e) { return {}; }
    }
    function saveSentState(state) {
      localStorage.setItem('tqf_sent', JSON.stringify(state));
    }

    // Authoritative, shared sent-state: the order carries an 'inspected' tag in
    // Shopify once a real send succeeds, so every device sees the same thing.
    // localStorage is only an optimistic fallback for the device that just sent.
    function isInspected(order) {
      var tags = (order.tags || '').split(',').map(function(t) { return t.trim().toLowerCase(); });
      return tags.indexOf('inspected') !== -1 || !!getSentState()[order.name];
    }

    // Fire the inspection event via the Worker. Resolves true on confirmed
    // success, false otherwise. Only a real success flips the Sent state.
    function fireInspection(order, btn, busyLabel) {
      btn.disabled = true;
      var prev = btn.textContent;
      btn.textContent = busyLabel;
      return fetch(WORKER_URL + '/api/inspect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: order.email,
          order_number: order.name,
          order_id: order.id,
          tags: order.tags || ''
        })
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.success) {
          var state = getSentState();
          state[order.name] = true;
          saveSentState(state);
          // Keep the in-memory order in sync so a re-render still reads as sent.
          if ((order.tags || '').toLowerCase().indexOf('inspected') === -1) {
            order.tags = (order.tags ? order.tags + ', ' : '') + 'inspected';
          }
          var msg = 'Inspection email sent for ' + order.name + ' to ' + order.email;
          if (data.tagged === false) msg += ' (note: could not tag the order — shared status may not sync)';
          showStatus(msg, 'success');
          return true;
        }
        showStatus('Failed for ' + order.name + ': ' + (data.error || 'Unknown error'), 'error');
        btn.disabled = false;
        btn.textContent = prev;
        return false;
      })
      .catch(function(err) {
        showStatus('Failed for ' + order.name + ': ' + err.message, 'error');
        btn.disabled = false;
        btn.textContent = prev;
        return false;
      });
    }

    // Build the action cell: "Send Inspection" when unsent, or a green "Sent"
    // status with a small "Re-send" button once sent (so a stuck/failed row is
    // always recoverable without touching the API directly).
    function buildActionControl(order) {
      var wrap = document.createElement('div');
      wrap.className = 'action-wrap';

      function rowClass(name, on) {
        var tr = wrap.closest ? wrap.closest('tr') : null;
        if (tr) tr.classList[on ? 'add' : 'remove'](name);
      }

      function renderUnsent() {
        wrap.textContent = '';
        rowClass('is-failed', false);
        var btn = document.createElement('button');
        btn.className = 'inspect-btn';
        btn.textContent = 'Send Inspection';
        btn.addEventListener('click', function() {
          fireInspection(order, btn, 'Sending...').then(function(ok) {
            if (ok) renderSent(); else renderFailed();
          });
        });
        wrap.appendChild(btn);
      }

      function renderSent() {
        wrap.textContent = '';
        rowClass('is-failed', false);
        var label = document.createElement('span');
        label.className = 'sent-label';
        label.textContent = 'Sent';
        var resend = document.createElement('button');
        resend.className = 'resend-btn';
        resend.textContent = 'Re-send';
        resend.addEventListener('click', function() {
          if (!confirm('Re-send the inspection email for ' + order.name + ' to ' + order.email + '?')) return;
          fireInspection(order, resend, 'Re-sending...').then(function() {
            renderSent();
          });
        });
        wrap.appendChild(label);
        wrap.appendChild(resend);
      }

      function renderFailed() {
        wrap.textContent = '';
        rowClass('is-failed', true);
        var label = document.createElement('span');
        label.className = 'failed-label';
        label.textContent = 'Failed';
        var retry = document.createElement('button');
        retry.className = 'retry-btn';
        retry.textContent = 'Retry';
        retry.addEventListener('click', function() {
          fireInspection(order, retry, 'Retrying...').then(function(ok) {
            if (ok) renderSent(); else renderFailed();
          });
        });
        wrap.appendChild(label);
        wrap.appendChild(retry);
      }

      if (isInspected(order)) renderSent(); else renderUnsent();
      return wrap;
    }

    // Render orders
    function renderOrders(orders) {
      var tbody = document.getElementById('orders-body');
      var empty = document.getElementById('empty-state');
      var table = document.getElementById('orders-table');
      tbody.textContent = '';

      if (orders.length === 0) {
        table.style.display = 'none';
        empty.style.display = 'block';
        return;
      }

      table.style.display = 'table';
      empty.style.display = 'none';

      var supplierState = getSupplierState();
      var sentState = getSentState();

      orders.forEach(function(order) {
        var tr = document.createElement('tr');

        // Order #
        var tdOrder = document.createElement('td');
        var numDiv = document.createElement('div');
        numDiv.className = 'order-number';
        numDiv.textContent = order.name;
        tdOrder.appendChild(numDiv);
        tr.appendChild(tdOrder);

        // Date
        var tdDate = document.createElement('td');
        tdDate.className = 'order-date';
        var d = new Date(order.created_at);
        tdDate.textContent = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        tr.appendChild(tdDate);

        // Customer
        var tdCust = document.createElement('td');
        var nameDiv = document.createElement('div');
        nameDiv.className = 'order-customer';
        nameDiv.textContent = order.customer_name;
        var emailDiv = document.createElement('div');
        emailDiv.className = 'order-email';
        emailDiv.textContent = order.email;
        tdCust.appendChild(nameDiv);
        tdCust.appendChild(emailDiv);
        tr.appendChild(tdCust);

        // Items
        var tdItems = document.createElement('td');
        tdItems.className = 'order-items';
        var itemTexts = order.items.map(function(i) {
          return i.title + (i.variant ? ' (' + i.variant + ')' : '') + ' x' + i.quantity;
        });
        tdItems.textContent = itemTexts.join(', ');
        tr.appendChild(tdItems);

        // Total
        var tdTotal = document.createElement('td');
        tdTotal.className = 'order-total';
        tdTotal.textContent = '$' + parseFloat(order.total).toFixed(2);
        tr.appendChild(tdTotal);

        // Supplier checkbox
        var tdSupplier = document.createElement('td');
        tdSupplier.style.textAlign = 'center';
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'supplier-check';
        cb.checked = !!supplierState[order.name];
        cb.addEventListener('change', function() {
          var state = getSupplierState();
          state[order.name] = cb.checked;
          saveSupplierState(state);
        });
        tdSupplier.appendChild(cb);
        tr.appendChild(tdSupplier);

        // Action button (Send Inspection, or Sent + Re-send)
        var tdAction = document.createElement('td');
        tdAction.appendChild(buildActionControl(order));
        tr.appendChild(tdAction);

        tbody.appendChild(tr);
      });
    }

    // Refresh button
    document.getElementById('refresh-btn').addEventListener('click', loadOrders);
  </script>

</body>
</html>
